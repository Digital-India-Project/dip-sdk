name: DIP SDK CI

on:
  pull_request:
    branches: ['*']
  push:
    branches:
      - 'development/**'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Build, Test & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenAPI type generation drift
        run: npm run check:types-drift && git diff --exit-code src/generated/openapi-types.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build ESM and CJS targets
        run: npm run build

      - name: Validate synchronization manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('integration/manifest.json', 'utf8'))"

      - name: Run full test suite (unit, integration, contract, compatibility, security, mock-provider)
        run: npm test

      - name: Dependency audit (when package-lock.json exists)
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "Skipping npm audit: no package-lock.json present"
          fi
